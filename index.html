t}.shock h1{color:#ff8d83;font-size:clamp(32px,8vw,64px)}.history{max-height:65vh;overflow:auto;white-space:pre-wrap}.tutorial{border-color:#9c8256}.tvisual{display:flex;align-items:center;justify-content:center;gap:10px;min-height:130px;background:#101820;border-radius:10px;padding:12px;flex-wrap:wrap}.tchip{border:1px solid #526773;background:#263846;padding:8px 12px;border-radius:8px;text-align:center}.tactive{border-color:#e4b875;background:#54452e}.tarrow{font-size:24px;color:#f2cf91}.tcontrols{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}.tdots{color:#f2cf91;letter-spacing:5px;text-align:center}.tstack{display:grid;gap:5px}.tdie{font-size:30px;border:2px solid #e4b875;padding:12px 22px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#54452e}.tvisual small{display:block}.tutorial p{margin:8px 0}.diceface{width:110px;height:125px;margin:12px auto;display:block}.diceface.rolling{animation:tumble .65s ease-out}@keyframes tumble{0%{transform:rotate(-170deg) scale(.6)}100%{transform:rotate(360deg) scale(1)}}.buyrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.buyrow b{min-width:35px;text-align:center}.buyrow button{padding:5px 9px}</style><main><header><small>獨立設計實驗 · 離線單人</small><h1>星軌末班車</h1><p class="muted">雲端觀光列車 · 四日試乘之旅</p></header><div id="app"></div></main><div id="modal"><div id="modalbody"></div></div><script>
const roles={探勘者:{sense:3,mind:1,charm:0},學者:{sense:1,mind:3,charm:0},交涉者:{sense:0,mind:1,charm:3}};

const phases=['早晨','午間','午後','夜晚','午夜'];const budgets=[5,4,5,4,7];const key='startrain-experiment-4';let s=null,snap=null,pending=null;
const metaKey='startrain-meta-v1';let meta={finished:false,points:0,ach:[]};try{Object.assign(meta,JSON.parse(localStorage.getItem(metaKey)||'{}'))}catch{}let mode='normal',build=[5,5,5];const attrKeys=['sense','mind','charm'];const mod=v=>v>=5?v-5:Math.ceil((v-5)/2);const left=()=>21+meta.points-build.reduce((a,b)=>a+b,0);function storeMeta(){localStorage.setItem(metaKey,JSON.stringify(meta))}function award(id){s.ach ||= [];if(s.ach.includes(id))return;s.ach.push(id);s.luck+=5;log('成就解鎖：'+id+'（幸運 +5）');if(!meta.ach.includes(id)){meta.ach.push(id);meta.points++;storeMeta()}}function diceSvg(n){return '<svg class="diceface rolling" viewBox="0 0 110 125"><g stroke="#a68b5c" stroke-width="1.5" stroke-linejoin="round"><path d="M55 3 100 35 107 65 55 122 3 65 10 35Z" fill="#344b60"/><path d="M55 3 10 35 55 25Z" fill="#b7d1dc"/><path d="M55 3 100 35 55 25Z" fill="#7598ac"/><path d="M10 35 3 65 30 85 55 25Z" fill="#42677d"/><path d="M100 35 107 65 80 85 55 25Z" fill="#294557"/><path d="M55 25 80 85 55 105 30 85Z" fill="#638da5"/><path d="M3 65 55 122 55 105 30 85Z" fill="#243b4b"/><path d="M107 65 55 122 55 105 80 85Z" fill="#172e40"/></g><text x="55" y="76" text-anchor="middle" font-size="29" font-weight="bold" fill="white">'+n+'</text></svg>'}const copy=x=>JSON.parse(JSON.stringify(x));const $=id=>document.getElementById(id);const has=x=>s.items.includes(x);const knows=x=>s.clues.includes(x);let audio;function sound(k){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let seq={click:[440],item:[523,659,784],clue:[392,587],death:[180,90],night:[330,220,165],rewind:[220,440,880,330]}[k];seq.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.12;o.type=k==='death'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.26)})}catch{}}document.addEventListener('click',e=>{if(e.target.closest('button'))sound('click')});const dreams=['守護旅者的塞萊斯蒂安大人，請用您神聖的血液保護旅者、用飽含星辰的心指引迷途、用純潔如寶石般的靈魂淨化罪惡。','神需要虔誠的心臟、新鮮的血液、跟人的靈魂。','會動的裝飾，沒有靈魂。','安置於瓶中的陳釀，是神聖的血液。','繪滿航向的心臟，藏於熔岩之中。','黑色的圓鑰匙可以打開祭壇。'];function normal(){return s.day===1&&!s.flags.staffDead&&!s.flags.awakened}function log(x){s.log.unshift(x);s.log=s.log.slice(0,500);s.current=(s.current||'')+'\n'+x}function clue(x){if(!knows(x)){s.clues.push(x);if(s.clues.length>=5)award('追尋真相');sound('clue');log('記下線索：'+x)}}function item(x){if(!has(x)){s.items.push(x);if(s.items.length>=5)award('旅行收藏家');sound('item');log('取得：'+x)}}function save(){localStorage.setItem(key,JSON.stringify({s,snap}))}function start(role){s={role,day:1,p:1,ap:4,hp:8,san:10,luck:4,statues:0,loc:'dining',items:[],clues:[],flags:{keyRoom:['own','mageRoom','boyRoom','boss'][Math.floor(Math.random()*4)]},trust:{mage:0,boy:0,boss:0},log:['列車於十一時啟程。午餐已備妥。'],end:null};s.mode=mode;s.ach=[];s.rewinds=0;s.sleeps=0;s.tenStreak=0;if(role==='自訂旅客'){s.custom=Object.fromEntries(attrKeys.map((k,i)=>[k,mod(build[i])]));s.luck=left()}snap=copy(s);save();render()}function rewind(reason){if(!s.statues&&s.mode!=='infinite'){end('航向地獄',reason+'。最後的保護已消失。');return}let old=s;s=copy(snap);s.mode=old.mode;s.ach=old.ach||[];s.rewinds=(old.rewinds||0)+1;s.sleeps=old.sleeps||0;s.tenStreak=old.tenStreak||0;s.statues=old.mode==='infinite'?3:old.statues-1;s.flags.awakened=true;s.luck=old.luck;s.clues=old.hp>0?old.clues:s.clues;s.san=old.hp>0?old.san:s.san;s.log=old.log;sound('rewind');if(old.hp>0)dreams.slice(0,(3-s.statues)*2).forEach(clue);log('你發現自己回到了今天剛起床的時候。');award('第一次折返');if(s.rewinds>=10)award('似曾相識');if(!s.statues&&s.mode!=='infinite')award('神也救不了你');save();render();pending=true;$('modal').classList.add('shock');$('modalbody').innerHTML='<h1>似曾相識</h1><p>你猛然睜開眼睛，發現自己回到了今天剛起床的時候。方才發生的一切，彷彿從未發生。</p><button id="rewindAck">繼續</button>';$('modal').style.display='grid';$('rewindAck').onclick=()=>{pending=null;$('modal').classList.remove('shock');$('modal').style.display='none';render()}}function hurt(n,m=0){s.hp-=n;s.san=Math.max(0,s.san-m);if(s.hp<=0){award('好奇心害死貓');sound('death');rewind('你已死亡');return true}return false}function end(title,desc){meta.finished=true;award('旅程的終點');if(title==='星光歸航'){award('星光歸航');if(!s.rewinds)award('一命通關');if(s.custom&&Object.values(s.custom).every(v=>v===-5))award('凡人之軀')}if(title==='墜落'&&s.flags.crash)award('列車墜毀');if(s.day===4&&s.p===4&&!(s.sleeps||0))award('你怎麼還不睡');storeMeta();s.end={title,desc};save();render()}function advance(){if(s.end)return;s.current='';if(s.p===3&&s.statues&&s.loc!=='own'){rewind('午夜未返回自己的房間');return}if(s.p===4){if(s.flags.sleep){s.sleeps=(s.sleeps||0)+1;s.sleepStreak=(s.sleepStreak||0)+1;if(s.sleepStreak>=4&&!s.rewinds)award('睡死')}else s.sleepStreak=0;let dream=s.flags.sleep?[dreams[(s.day-1)%dreams.length],dreams[(s.day+1)%dreams.length]]:[];if(s.flags.crash){end('墜落','失去列車長的引擎無法維持飛行。');return}if(s.day===4){end('最後一站',s.flags.open?'祭壇雖已開啟，但儀式未完成，邪神奪走了旅客的靈魂。':'第四夜結束，祭壇仍未開啟。邪神奪走了你的靈魂，無論是否在戰鬥中存活。');return}s.day++;s.p=0;s.ap=budgets[0];if(s.flags.sleep){s.hp=Math.min(8,s.hp+3);s.san=Math.min(10,s.san+1)}else{s.san=Math.max(0,s.san-1)}delete s.flags.sleep;delete s.flags.nightSeen;log('第 '+s.day+' 天清晨，時間錨點更新。');if(dream.length){log('夢中，兩道陌生的聲音先後響起：');dream.forEach(clue)}snap=copy(s)}else{s.p++;s.ap=budgets[s.p];if(s.day===1&&s.p===3){log('傍晚，乘務員突然死亡。法師在走廊布置法陣。');sound('death');s.flags.staffDead=true;if(!s.flags.awakened){s.statues=3;s.flags.awakened=true}}if(s.p===3&&s.day===2){sound('death');log('傍晚，法師死亡。');s.flags.mageDead=true}if(s.p===3&&s.day===3){sound('death');log('傍晚，冒險者死亡。');s.flags.boyDead=true}if(s.p===3)sound('night');if(s.p===3&&s.day===4){log('傍晚，財團老闆向你發動攻擊！');s.flags.bossFight=true;save();render();check(0,'sense',8,()=>{log('你避開富豪的攻擊，暫時脫身。');s.flags.bossFight=false},()=>{log('富豪擊傷了你。');s.flags.bossFight=false;if(s.hp<=4)award('被富豪殺死');hurt(4,2)});return}if(s.p===1&&s.day>1)log('午餐時又有一張座位空了。');if(s.p===4){log(s.statues?'房門被女神的法術封住。':'午夜，史萊姆解除偽裝，車廂自行修整。');}}save();render();if(s.day===1&&s.p===3&&s.flags.staffDead&&!s.flags.deathShown){s.flags.deathShown=true;save();shock()}}
function shock(){pending=true;const m=$('modal');m.classList.add('shock');$('modalbody').innerHTML='<small>第一天 · 18:00</small><h1>乘務員死亡</h1><p>砰！一聲巨響震動整節車廂。</p><p>乘務員倒在地上，再也沒有回應。餐廳的談笑聲戛然而止。</p><p>法師匆匆趕來，在走廊布下法陣。三尊女神像隨之出現。</p><button id="ack">繼續</button>';m.style.display='grid';sound('death');$('ack').onclick=()=>{pending=null;m.classList.remove('shock');m.style.display='none';render()}}function spend(n){if(s.ap<n||pending)return false;s.current='';s.ap-=n;return true}function finish(){if(visible('kitchen')&&visible('shrine'))award('我全都要');save();render();if(!s.end&&!pending&&s.ap===0&&!(s.p===3&&s.loc!=='own'))advance()}function act(n,fn){if(!spend(n))return;fn();finish()}function check(n,attr,dc,success,fail){if(!spend(n))return;let raw=1+Math.floor(Math.random()*10),bonus=(s.custom||roles[s.role])[attr]-(s.san<=3?2:0),total=raw+bonus,need=Math.max(0,dc-total);if(raw===1&&s.luck===0)award('天生倒楣');s.tenStreak=raw===10?(s.tenStreak||0)+1:0;if(s.tenStreak>=3)award('天選之人');function resolve(ok){$('modal').style.display='none';pending=null;log('檢定 '+total+' / '+dc+(ok?' 成功':' 失敗'));(ok?success:fail)();finish()}pending=true;if(total>=dc){$('modalbody').innerHTML='<small>擲骰檢定</small>'+diceSvg(raw)+'<p>總值 '+total+' / '+dc+' · 成功</p>';$('modal').style.display='grid';setTimeout(()=>resolve(true),750);return}$('modalbody').innerHTML=`<small>檢定失敗 · 目標 ${dc}</small>${diceSvg(raw)}<p>總值 ${total}，尚差 ${need} 點</p><button id="boost" ${s.luck<need?'disabled':''}>消耗 ${need} 幸運值換取成功</button> <button id="resolve">接受失敗</button>`;$('boost').onclick=()=>{if(s.luck>=need){s.luck-=need;total+=need;resolve(true)}};$('resolve').onclick=()=>resolve(false);$('modal').style.display='grid'}
function accessible(id){return id!=='kitchen'||has('廚房鑰匙')||s.flags.kitchen}function visible(id){return accessible(id)&&(id!=='shrine'||knows('隱藏祈禱室'))}const edges={engine:['dining'],dining:['engine','hall','kitchen'],kitchen:['dining'],hall:['dining','corr'],corr:['hall','own','corr2'],own:['corr'],corr2:['corr','mageRoom','corr3'],mageRoom:['corr2'],corr3:['corr2','boyRoom','corr4'],boyRoom:['corr3'],corr4:['corr3','boss','shrine'],boss:['corr4'],shrine:['corr4']};
function move(id){if(!edges[s.loc].includes(id)||!visible(id)||s.p===4&&s.statues)return;act(1,()=>{s.loc=id;if(s.p===4&&!s.statues&&id!=='own'&&Math.random()<.25){log('凝膠怪從牆角撲來。');hurt(2,1)}})}
function choose(title,options){$('modalbody').innerHTML='<h3>'+title+'</h3>'+options.map((x,i)=>`<button data-choice="${i}">${x[0]}</button> `).join('')+'<button id="cancelChoice">取消</button>'; $('modal').style.display='grid';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{$('modal').style.display='none';options[+b.dataset.choice][1]()});$('cancelChoice').onclick=()=>$('modal').style.display='none'}
function useItem(){if(!s.items.length){log('背包沒有可使用的物品。');render();return}choose('選擇使用的物品',s.items.map(x=>[x,()=>{if((s.flags.altar||[]).includes(x)){log('物品仍在祭壇上，請先取回。');render();return}if(x==='佳釀'||x==='神聖之血'){choose('要喝下這瓶酒嗎？',[['喝下',()=>act(1,()=>{if(x==='神聖之血')award('乾杯！');s.items=s.items.filter(v=>v!==x);s.san=Math.min(10,s.san+2);log('你喝下陳釀，暖意使你稍微放鬆。理智最多恢復 2 點。')})]]);return}if(s.loc==='shrine'&&x==='黑色圓鑰匙'){if(s.flags.open){log('封印已經解除。');render();return}act(1,()=>{s.flags.open=true;log('圓石嵌入牆面，封印無聲消散。')});return}log(x+' 在此處無法使用。沒有消耗行動力或物品。');render()}]))}
function investigate(){let loc=s.loc;if(normal()){act(2,()=>{log(({engine:'控制台上的儀表運轉平穩，熔岩史萊姆忙著維持設備。',hall:'牆上掛著精緻的肖像，沙發柔軟舒適。',dining:'桌上擺著銀器、餐巾與今日菜單。',own:'床鋪整潔，地毯柔軟，窗邊備有旅行指南。',mageRoom:'桌上擺著旅行筆記。',boyRoom:'旅行袋裡放著換洗衣物。',boss:'桌上擺著公司簡介。',corr4:'走廊末端裝飾著木質牆板。'})[loc]||'車廂整潔，沒有特別值得注意的地方。')});return}let yes=()=>{switch(loc){case 'engine':log('你沿著管線查看，發現控制台下壓著一枚刻滿星辰的古老圓盤。');item('星盤');break;case 'hall':log('你凝視唯一不動的肖像。畫中人終於閉上眼，嘴裡落下一顆寶石。');item('靈魂之石');break;case 'kitchen':log('冷藏櫃裡只有魚蝦，沒有肉類。酒櫃深處有一瓶陳釀。');item('佳釀');clue('地板上的法陣似乎約束著無形的廚師。');break;case 'corr4':log('牆上的接縫形成門的輪廓，卻找不到把手。');clue('隱藏祈禱室');break;case 'own':case 'mageRoom':case 'boyRoom':case 'boss':log('你掀起地毯，摸索床底與家具縫隙。');if(loc===s.flags.keyRoom&&!has('黑色圓鑰匙')){log('地毯下藏著一枚冰冷的黑色圓石。');item('黑色圓鑰匙')}else if(loc==='own'||loc==='boss'){clue('隱藏祈禱室');log('一張舊配置圖標出列車末端多出的一節車廂。')}else log(loc==='mageRoom'?'筆記記錄著不同星辰的航向。':'旅行袋裡只有換洗衣物與乾糧。');break;case 'dining':log('餐具上刻著列車公司的徽記。每張座位都配有名牌。');break;default:log('你仔細查看牆面與地板，沒有發現其他異常。')}};check(2,'sense',loc==='engine'?8:6,yes,()=>log('你仔細翻找了一遍，仍未能辨認出有用的細節。'))}
const dialogue={mage:[['這趟旅行','「我只是想看看不同世界的天空。至於其他旅客，我並不熟悉。」'],['窗外的景色','法師望向窗外，沉默片刻。「星辰的位置不對。這不是原定航線。」'],['信仰','「塞萊斯蒂安守護旅者。祂不一定會回答祈禱，但旅人總得知道自己要去哪。」']],boy:[['自我介紹','「我是來旅行的！你也是第一次坐這種列車嗎？」'],['史萊姆','「牠們有自己的語言喔。你仔細聽，咕嚕聲其實不完全一樣。」'],['旅行用品','少年拍拍背包。「我帶了一瓶好酒，本來想到了目的地再喝。」']],boss:[['列車的由來','「這可是我們投入大量資金的計畫，安全方面自然有人負責。」'],['改造工程','「有些設計是贊助方要求的。我只負責讓計畫順利完成。」'],['旅行感想','他避開你的視線。「別讓一些小事破壞這趟旅行。」']]};
function talk(n){choose('與'+names[n]+'交談',dialogue[n].map(([topic,line],i)=>[topic,()=>act(1,()=>{log(normal()&&n==='mage'&&i===1?'「雲海很漂亮，我很期待今晚的星空。」':normal()&&n==='boss'&&i===1?'「我們請了不少工匠改善車廂的舒適度。」':normal()&&n==='boss'&&i===2?'「希望各位旅客玩得愉快。」':line);s.trust[n]++;if(n==='boy'&&i===2&&s.trust.boy>=2){item('神聖之血');log('少年將酒瓶交給你：「你先替我保管吧。」')}})]))}
function actions(){let a=[];const add=(name,cost,fn,disabled=false)=>a.push({name,cost,fn,disabled});const t=(name,cost,fn,disabled=false)=>add(name,cost,()=>act(cost,fn),disabled);const c=(name,cost,attr,dc,yes,no=()=>log('對方沒有答應。'))=>add(name,cost,()=>check(cost,attr,dc,yes,no));add('調查',2,investigate);if(s.loc!=='engine')add('使用',1,useItem,!s.items.length);for(const n of Object.keys(names))if(present(n))add('與'+names[n]+'交談',1,()=>talk(n));switch(s.loc){case 'engine':c('與列車長戰鬥',2,'sense',8,()=>{s.flags.crash=true;item('星盤');log('熔岩史萊姆失去形體，引擎的轟鳴逐漸紊亂。')},()=>{log('熔岩史萊姆反擊，熱浪灼傷了你。');hurt(2,1)});t('給列車長乖乖',1,()=>{s.items=s.items.filter(x=>x!=='乖乖');award('乖孩子');log('熔岩史萊姆高興地吞下零食，從身體裡推出一枚圓盤。');item('星盤')},!has('乖乖')||s.flags.crash);break;case 'dining':if(s.p===1||s.p===3)t('享用餐點',1,()=>{s.flags.meals ||= {};s.flags.meals[s.day+'-'+s.p]=true;s.hp=Math.min(8,s.hp+1);log(s.p===1?'午餐是香煎魚、蔬菜與麵包。':'晚餐是海鮮燉飯與熱湯。');log('用餐完畢，生命最多恢復 1 點。')},!!s.flags.meals?.[s.day+'-'+s.p]);t('向烏購買乖乖',1,()=>{item('乖乖');log('黑色史萊姆將零食推到你面前。')},has('乖乖'));if(s.day===1&&s.p<3)add('與乘務員交談',1,()=>choose('與乘務員交談',[['列車介紹',()=>act(1,()=>log('「這是最新型的無人飛行觀光列車，旅程共四天，沿途可欣賞雲海。」'))],['餐點',()=>act(1,()=>log('「午餐與晚餐都在餐廳供應，請慢用。」'))],['客房與設施',()=>act(1,()=>log('「各位有自己的客房，交誼廳全天開放。廚房是員工工作區。」'))]]));if(!normal()&&!accessible('kitchen'))c('與烏交談',2,'charm',7,()=>{item('廚房鑰匙');log('烏從身體裡吐出一把鑰匙，朝廚房方向挪動。')});break;case 'own':if(s.p===4)add('睡眠（結束午夜）',0,()=>{s.flags.sleep=true;advance()});break;case 'shrine':if(s.flags.open){s.flags.altar ||= [];for(const x of s.items.filter(x=>!s.flags.altar.includes(x)))t('擺放：'+x,0,()=>{if(s.flags.altar.length<3)s.flags.altar.push(x)},s.flags.altar.length>=3);for(const x of s.flags.altar)t('取回：'+x,0,()=>{s.flags.altar=s.flags.altar.filter(v=>v!==x)});t('啟動祭壇',1,()=>{if(['星盤','靈魂之石'].every(x=>s.flags.altar.includes(x))&&['神聖之血','佳釀'].some(x=>s.flags.altar.includes(x)))end('星光歸航','星光照亮列車，尚存旅客得以返航。');else{award('錯誤的信仰');log('祭壇沒有回應。');sound('night')}},s.flags.altar.length!==3)}break}return a}
let tutorialStep=0;const tutorialPages=[
['移動車廂','<div class="tstack"><span class="tchip">引擎室</span><span class="tchip tactive">餐廳 · 目前位置</span><span class="tchip">交誼廳</span></div><span class="tarrow">→</span><span class="tchip">點擊相鄰車廂<small>−1 AP</small></span>','金色框是你的位置。點擊相鄰且可用的車廂移動；灰色按鈕暫時不能前往。'],
['行動力與時間','<span class="tchip">午間<small>行動力 4</small></span><span class="tarrow">→</span><span class="tchip">調查 −2 AP<small>剩餘 2</small></span><span class="tarrow">→</span><span class="tchip">0 AP<small>下一階段</small></span>','每項行動旁會標示 AP 消耗。用完通常自動進入下一階段，也可點「結束階段」提前結束。'],
['探索與交談','<div class="tstack"><span class="tchip">調查 · 2 AP</span><span class="tchip">與旅客交談 · 1 AP</span></div><span class="tarrow">→</span><span class="tchip">當前事件<small>閱讀行動結果</small></span>','點擊調查觀察環境，或與同一車廂的旅客交談並選擇話題。結果會顯示在畫面上方。'],
['骰子與幸運','<span class="tdie">4</span><span class="tarrow">+ 1 = 5</span><span class="tchip">目標 6<small>差 1 點</small></span><span class="tchip tactive">消耗 1 幸運值<small>換取成功</small></span>','部分行動需要 D10 檢定。成功直接結算；失敗可接受結果，或消耗足夠幸運值換取成功。'],
['物品與筆記','<div class="tstack"><span class="tchip">背包 ▣</span><span class="tchip">使用 → 選擇物品</span></div><span class="tarrow">↔</span><div class="tstack"><span class="tchip">調查筆記 ▤</span><span class="tchip">歷史訊息 ↶</span></div>','取得的物品放在背包。點「使用」選擇物品；調查筆記與歷史訊息可以回顧已知資訊。'],
['回房與休息','<span class="tchip">夜晚 ☾</span><span class="tarrow">→</span><span class="tchip tactive">一鍵返回房間<small>免費</small></span><span class="tarrow">→</span><span class="tchip">午夜<small>睡眠</small></span>','夜晚可免費一鍵回房，午夜在自己的房間可選擇睡眠。遊戲會自動存檔。']
];function drawTutorial(){let el=$('tutorial');if(!el)return;let [title,visual,desc]=tutorialPages[tutorialStep];el.innerHTML='<small>新手教學 · '+(tutorialStep+1)+' / '+tutorialPages.length+'</small><h2>'+title+'</h2><div class="tvisual" aria-hidden="true">'+visual+'</div><p>'+desc+'</p><div class="tdots" aria-hidden="true">'+tutorialPages.map((_,i)=>i===tutorialStep?'●':'○').join('')+'</div><div class="tcontrols"><button id="tprev" '+(tutorialStep===0?'disabled':'')+'>← 上一步</button><button id="tskip">略過教學</button><button id="tnext">'+(tutorialStep===tutorialPages.length-1?'開始選擇旅客 →':'下一步 →')+'</button></div>';$('tprev').onclick=()=>{tutorialStep--;drawTutorial()};$('tnext').onclick=()=>{if(tutorialStep<tutorialPages.length-1){tutorialStep++;drawTutorial()}else closeTutorial()};$('tskip').onclick=closeTutorial}function closeTutorial(){try{localStorage.setItem('startrain-tutorial-seen','1')}catch{}$('tutorial').hidden=true;$('rolePanel').hidden=false}function initTutorial(){let seen=false;try{seen=localStorage.getItem('startrain-tutorial-seen')==='1'}catch{}$('tutorial').hidden=seen;$('rolePanel').hidden=!seen;tutorialStep=0;drawTutorial();$('reopenTutorial').onclick=()=>{$('tutorial').hidden=false;$('rolePanel').hidden=true;tutorialStep=0;drawTutorial()}}
function setupBuild(){let el=$('buildPanel');if(!el)return;el.innerHTML='<h3>自由配點</h3><p>剩餘購點：'+left()+'（轉為幸運）</p>'+['觀察','知識','交涉'].map((n,i)=>'<div class="buyrow"><span>'+n+'</span><button data-buy="'+i+':min">最小</button><button data-buy="'+i+':down">−</button><b>'+build[i]+'</b><button data-buy="'+i+':up">＋</button><button data-buy="'+i+':max">最大</button><small>調整值 '+mod(build[i])+'</small></div>').join('')+'<button id="allmin">全 −5</button> <button id="avg">平均分配</button> <button id="clearbuy">重置</button> <button id="customStart">自訂旅客出發</button>';el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let [i,k]=b.dataset.buy.split(':');i=+i;build[i]=k==='min'?-5:k==='down'?Math.max(-5,build[i]-1):k==='up'?Math.min(10,build[i]+Math.min(1,left())):Math.min(10,build[i]+left());setupBuild()});$('allmin').onclick=()=>{build.fill(-5);setupBuild()};$('clearbuy').onclick=()=>{build.fill(5);setupBuild()};$('avg').onclick=()=>{while(left()>0&&Math.min(...build)<10)build[build.indexOf(Math.min(...build))]++;setupBuild()};$('customStart').onclick=()=>start('自訂旅客')}function render(){if(!s){$('app').innerHTML='<div id="tutorial" class="panel tutorial"></div><div id="rolePanel" class="panel"><h2>選擇旅客</h2><p>你受邀參加四日觀光列車試乘活動。列車即將啟程，請選擇你的旅客身分。</p><div class="actions">'+Object.entries(roles).map(([r,v])=>`<button data-role="${r}">${r}｜觀察 +${v.sense} · 知識 +${v.mind} · 交涉 +${v.charm}</button>`).join('')+'<button id="continue">繼續上次遊戲</button><button id="reopenTutorial">查看操作教學</button></div><h3>遊戲模式</h3><select id="gameMode"><option value="normal">一般模式</option><option value="infinite">無限女神像</option></select><p>成就：'+meta.ach.length+'/20 · 永久購點 +'+meta.points+'</p><div>'+meta.ach.join('、')+'</div>'+(meta.finished?'<div id="buildPanel"></div>':'<small>完成任一結局後解鎖自由配點。</small>')+'</div>';initTutorial();$('gameMode').value=mode;$('gameMode').onchange=e=>mode=e.target.value;setupBuild();document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>start(b.dataset.role));$('continue').onclick=()=>{try{let x=JSON.parse(localStorage.getItem(key));s=x.s;snap=x.snap;render()}catch{alert('沒有存檔')}};return}if(s.end){$('app').innerHTML=`<div class="panel"><small>結局</small><h2 class="gold">${s.end.title}</h2><p>${s.end.desc}</p><p>發現 ${s.clues.length} 條線索 · 剩餘女神像 ${s.statues}</p><h3>本局成就（${(s.ach||[]).length}）</h3>${(s.ach||[]).map(x=>`<span class="tag">🏆 ${x}</span>`).join('')||'本局未達成成就'}<p>永久額外購點：${meta.points}</p><button id="restart">重新開始</button></div>`;$('restart').onclick=()=>{s=null;render()};return}let a=actions();$('app').innerHTML=`<div class="panel"><h3>當前事件</h3><button id="history">歷史訊息</button><div style="white-space:pre-line">${s.current||s.log[0]}</div></div><div class="panel stats"><div class="stat"><small>第 ${s.day} 天</small><b>${phases[s.p]}</b></div><div class="stat"><small>行動力</small><b>${s.ap}</b></div><div class="stat"><small>生命</small><b>${s.hp}/8</b></div><div class="stat"><small>理智</small><b>${s.san}/10</b></div><div class="stat"><small>幸運</small><b>${s.luck}</b></div><div class="stat" style="${s.flags.awakened?'':'display:none'}"><small>女神像</small><b>${s.flags.awakened&&s.mode==='infinite'?'∞':s.flags.awakened?Array.from({length:3},(_,i)=>`<svg width="24" height="32" viewBox="0 0 24 32" style="opacity:${i<s.statues?1:.2}" fill="currentColor"><circle cx="12" cy="5" r="3"/><path d="M9 9L3 17 6 19 9 15 5 28H19L15 15 18 19 21 17 15 9Z"/><rect x="3" y="29" width="18" height="2"/></svg>`).join(''):'—'}</b></div></div><div class="grid"><aside class="panel"><h3>列車</h3><div class="map">${[['engine'],['dining','kitchen'],['hall'],['corr','own'],['corr2','mageRoom'],['corr3','boyRoom'],['corr4','boss'],['shrine']].map(row=>`<div class="maprow">${row.filter(visible).map(id=>`<button data-room="${id}" class="${s.loc===id?'here':''}" ${!edges[s.loc].includes(id)||s.ap<1||s.p===4&&s.statues?'disabled':''}>${rooms[id][0]}</button>`).join('')}</div>`).join('')}</div></aside><section><div class="panel"><small>${s.role} · ${phases[s.p]}</small><h2>${rooms[s.loc][0]}</h2><p>${normal()&&s.loc==='dining'?'銀器排列整齊，窗外是明亮的雲海。':normal()&&s.loc==='corr4'?'走廊末端是精緻的木質牆板。':rooms[s.loc][1]}</p>${s.san<=3?'<p class="danger">星光在耳邊低語。所有檢定 −2。</p>':''}<div class="actions">${a.map((x,i)=>`<button data-act="${i}" ${x.disabled||s.ap<x.cost?'disabled':''}>${x.name} <small> · ${x.cost} AP</small></button>`).join('')}${s.p===3&&s.loc!=='own'?'<button id="home">一鍵返回房間（免費）</button>':''}<button id="next">結束階段 →</button></div></div><div class="panel"><h3>背包</h3>${s.items.map(x=>`<span class="tag">${x}</span>`).join('')||'空'}<h3>調查筆記</h3>${s.clues.map(x=>`<div>• ${x}</div>`).join('')||'尚無線索'}</div></section></div><button id="reset">返回標題</button>`;$('history').onclick=()=>{$('modalbody').innerHTML='<h3>歷史訊息</h3><div class="history"></div><button id="closeHistory">關閉</button>';$('modalbody').querySelector('.history').textContent=s.log.join('\n\n');$('modal').style.display='grid';$('closeHistory').onclick=()=> $('modal').style.display='none'};document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>move(b.dataset.room));document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>a[+b.dataset.act].fn());if($('home'))$('home').onclick=()=>{s.loc='own';log('返回自己的房間。');finish()};$('next').onclick=()=>{if(s.flags.crash&&s.p===4){end('墜落','失去列車長的引擎無法維持飛行。');return}advance()};$('reset').onclick=()=>{s=null;render()}}
render();</script></html>
