const phases=['早晨','午間','午後','夜晚','午夜'];const budgets=[5,4,5,4,7];const key='startrain-experiment-4';let s=null,snap=null,pending=null;
const metaKey='startrain-meta-v1';let meta={finished:false,points:0,ach:[]};try{Object.assign(meta,JSON.parse(localStorage.getItem(metaKey)||'{}'))}catch{}let mode='normal',build=[5,5,5];const attrKeys=['sense','mind','charm'];const mod=v=>v>=5?v-5:Math.ceil((v-5)/2);const left=()=>21+meta.points-build.reduce((a,b)=>a+b,0);function storeMeta(){localStorage.setItem(metaKey,JSON.stringify(meta))}function award(id){s.ach ||= [];if(s.ach.includes(id))return;s.ach.push(id);s.luck+=5;log('成就解鎖：'+id+'（幸運 +5）');if(!meta.ach.includes(id)){meta.ach.push(id);meta.points++;storeMeta()}}function diceSvg(n){return '<svg class="diceface rolling" viewBox="0 0 110 125"><g stroke="#a68b5c" stroke-width="1.5" stroke-linejoin="round"><path d="M55 3 100 35 107 65 55 122 3 65 10 35Z" fill="#344b60"/><path d="M55 3 10 35 55 25Z" fill="#b7d1dc"/><path d="M55 3 100 35 55 25Z" fill="#7598ac"/><path d="M10 35 3 65 30 85 55 25Z" fill="#42677d"/><path d="M100 35 107 65 80 85 55 25Z" fill="#294557"/><path d="M55 25 80 85 55 105 30 85Z" fill="#638da5"/><path d="M3 65 55 122 55 105 30 85Z" fill="#243b4b"/><path d="M107 65 55 122 55 105 80 85Z" fill="#172e40"/></g><text x="55" y="76" text-anchor="middle" font-size="29" font-weight="bold" fill="white">'+n+'</text></svg>'}const copy=x=>JSON.parse(JSON.stringify(x));const $=id=>document.getElementById(id);const has=x=>s.items.includes(x);const knows=x=>s.clues.includes(x);let audio;function sound(k){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let seq={click:[440],item:[523,659,784],clue:[392,587],death:[180,90],night:[330,220,165],rewind:[220,440,880,330]}[k];seq.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.12;o.type=k==='death'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.26)})}catch{}}document.addEventListener('click',e=>{if(e.target. ||[];s.rewinds=(old.rewinds||0)+1;s.damageTotal=old.damageTotal||0;s.sleeps=old.sleeps||0;s.tenStreak=old.tenStreak||0;s.statues=old.mode==='infinite'?3:Math.max(0,old.statues-1);s.flags.awakened=true;s.luck=old.luck;s.clues=old.hp>0?old.clues:s.clues;s.san=old.hp>0?old.san:s.san;s.log=old.log;sound('rewind');let heard=old.hp>0?dreams.slice(0,Math.min(dreams.length,Math.max(1,s.rewinds)*2)):[];heard.forEach(clue);log('你發現自己回到了今天剛起床的時候。');award('第一次折返');if(s.rewinds>=10)award('似曾相識');if(!s.statues&&s.mode!=='infinite')award('神也救不了你');save();render();pending=true;$('modal').classList.add('shock');$('modalbody').innerHTML='<h1>似曾相識</h1><p>你猛然睜開眼睛，發現自己回到了今天剛起床的時候。方才發生的一切，彷彿從未發生。</p><button id="rewindAck">繼續</button>';$('modal').style.display='grid';$('rewindAck').onclick=()=>{pending=null;$('modal').classList.remove('shock');$('modal').style.display='none';voicePopup(heard)}}function hurt(n,m=0){s.hp-=n;s.san=Math.max(0,s.san-m);if(s.hp<=0){award('好奇心害死貓');sound('death');rewind('你已死亡');return true}return false}const extraAchievements={'戰鬥爽':'本局累計對敵人造成至少20點傷害。','皮皮皮皮皮':'成功召喚二十四隻皮卡丘。解鎖後，新遊戲初始獲得寶可球。','饕餮':'吃完旅程中所有供應的早餐、午餐與晚餐（首日無早餐）。'};const achievementDetails={"旅程的終點":"完成任意一個遊戲結局。","第一次折返":"首次經歷時間回朔。","追尋真相":"累積五條不同的線索。","旅行收藏家":"同時持有五種不同物品。","星光歸航":"完成正確的祭壇儀式，讓列車返航。","一命通關":"未經任何回朔，達成星光歸航。","神也救不了你":"在一般模式中耗盡三尊女神像。","乾杯！":"喝下神聖之血。","乖孩子":"將乖乖餵給列車長。","天生倒楣":"幸運值為零時擲出自然 1。","天選之人":"連續三次檢定擲出自然 10。","凡人之軀":"以三項屬性皆為 −5 的自訂旅客達成星光歸航。","好奇心害死貓":"在旅程中死亡。","你怎麼還不睡":"從未睡眠，並在第四天午夜迎來結局。","我全都要":"同時發現廚房與隱藏祈禱室。","似曾相識":"同一局經歷至少十次回朔。","錯誤的信仰":"使用無法引發回應的祭品組合啟動祭壇。","列車墜毀":"殺死列車長後迎來墜落結局。","睡死":"連續睡眠四晚，且整局未曾回朔。","被富豪殺死":"第四天傍晚遭財團老闆的襲擊致死。"};Object.assign(achievementDetails,extraAchievements);const achievementHints={"旅程的終點":"每一趟旅程都有終點。","第一次折返":"有些早晨似曾相識。","追尋真相":"別放過任何蛛絲馬跡。","旅行收藏家":"背包裡總能再塞點東西。","星光歸航":"迷途的旅人需要星光。","一命通關":"有些旅程不需要重來。","神也救不了你":"庇護並非取之不盡。","乾杯！":"有些酒值得親口品嚐。","乖孩子":"誰說熔岩不喜歡零食？","天生倒楣":"連幸運都拋棄了你。","天選之人":"好運能連續降臨幾次？","凡人之軀":"一無所長，也能走到終點嗎？","好奇心害死貓":"有些危險值得親身體會。","你怎麼還不睡":"四個夜晚， ght="32" viewBox="0 0 24 32" style="opacity:${i<s.statues?1:.2}" fill="currentColor"><circle cx="12" cy="5" r="3"/><path d="M9 9L3 17 6 19 9 15 5 28H19L15 15 18 19 21 17 15 9Z"/><rect x="3" y="29" width="18" height="2"/></svg>`).join(''):'—'}</b></div></div><div class="grid"><aside class="panel"><h3>列車</h3><div class="map">${[['engine'],['dining','kitchen'],['hall'],['corr','own'],['corr2','mageRoom'],['corr3','boyRoom'],['corr4','boss'],['shrine']].map(row=>`<div class="maprow">${row.filter(visible).map(id=>`<button data-room="${id}" class="${s.loc===id?'here':''}" ${!edges[s.loc].includes(id)||s.ap<1||s.p===4&&s.statues?'disabled':''}>${rooms[id][0]}</button>`).join('')}</div>`).join('')}</div></aside><section><div class="panel"><small>${s.role} · ${phases[s.p]}</small><h2>${activeNpc?combatants[activeNpc][0]:rooms[s.loc][0]}</h2><p>${activeNpc?(alive(activeNpc)?descriptions[activeNpc]:'對方已經倒下，再也沒有回應。')+(activeNpc==='wu'&&s.flags.carryWu?' 牠正待在你的懷裡。':''):normal()&&s.loc==='dining'?'銀器排列整齊，窗外是明亮的雲海。':normal()&&s.loc==='corr4'?'走廊末端是精緻的木質牆板。':rooms[s.loc][1]}</p>${s.san<=3?'<p class="danger">星光在耳邊低語。所有檢定 −2。</p>':''}<div class="actions">${a.map((x,i)=>`<button data-act="${i}" ${x.disabled||s.ap<x.cost?'disabled':''}>${x.name} <small>${x.cost?' · '+x.cost+' AP':''}</small></button>`).join('')}${activeNpc&&npcResult?'<div class="panel" style="white-space:pre-line"><small>互動結果</small><div>'+npcResult+'</div></div>':''}${!activeNpc&&s.p===3&&s.loc!=='own'?'<button id="home">一鍵返回房間（免費）</button>':''}<button id="next">結束階段 →</button></div></div><div class="panel"><h3>背包</h3>${[...new Set(s.items)].map(x=>`<span class="tag">${x}${s.items.filter(v=>v===x).length>1?' ×'+s.items.filter(v=>v===x).length:''}</span>`).join('')||'空'}<h3>調查筆記</h3>${s.clues.map(x=>`<div>• ${x}</div>`).join('')||'尚無線索'}</div></section></div><button id="reset">返回標題</button>`;$('history').onclick=()=>{$('modalbody').innerHTML='<h3>歷史訊息</h3><div class="history"></div><button id="closeHistory">關閉</button>';$('modalbody').querySelector('.history').textContent=s.log.join('\n\n');$('modal').style.display='grid';$('closeHistory').onclick=()=> $('modal').style.display='none'};document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>move(b.dataset.room));document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>a[+b.dataset.act].fn());if($('home'))$('home').onclick=()=>{s.loc='own';log('返回自己的房間。');finish()};$('next').onclick=()=>{if(s.flags.crash&&s.p===4){end('墜落','失去列車長的引擎無法維持飛行。');return}advance()};$('reset').onclick=()=>{activeNpc=null;s=null;render()}}
